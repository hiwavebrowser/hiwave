<!doctype html>
<html><head><style>
body { margin: 0; font: 13px Arial; background: #fff; }
.r { position: absolute; left: 10px; height: 40px; }
input, button { width: 120px; height: 24px; margin: 0; padding: 0; border-color: #000; vertical-align: top; }
</style></head><body>
<div class="r" style="top:0"><input> <button>b</button></div>
<div class="r" style="top:40px"><input style="border:1px solid"> <button style="border:1px solid">b</button></div>
<div class="r" style="top:80px"><input style="border:0"> <button style="border:0">b</button></div>
<div class="r" style="top:120px"><input style="border-width:0;border-style:solid"> <button style="border-width:0;border-style:solid">b</button></div>
<div class="r" style="top:160px"><input style="border:thin solid"> <button style="border:thin solid">b</button></div>
<div class="r" style="top:200px"><input style="border:medium solid"> <button style="border:medium solid">b</button></div>
<div class="r" style="top:240px"><input style="border:0.0625rem solid"> <button style="border:0.0625rem solid">b</button></div>
<div class="r" style="top:280px"><input style="border:calc(1px) solid"> <button style="border:calc(1px) solid">b</button></div>
<div class="r" style="top:320px;--w:1px"><input style="border:var(--w) solid"> <button style="border:var(--w) solid">b</button></div>
<div class="r" style="top:360px"><input style="border:1px solid transparent"> <button style="border:1px solid transparent">b</button></div>
<div class="r" style="top:400px"><input style="border:3px solid"> <button style="border:3px solid">b</button></div>
<div class="r" style="top:440px"><input style="border-width:1px;border-style:solid;border-color:#a2a9b1"> <button style="border-width:1px;border-style:solid;border-color:#a2a9b1">b</button></div>
<div class="r" style="top:480px"><input style="border:1px solid;border-top:0"> <button style="border:1px solid;border-top:0">b</button></div>
<div class="r" style="top:520px"><input style="border:0.05em solid"> <button style="border:0.05em solid">b</button></div>
<div class="r" style="top:560px"><select style="border:1px solid;width:120px;height:24px"><option>s</option></select> <select style="border:0;width:120px;height:24px"><option>s</option></select></div>
</body></html>
